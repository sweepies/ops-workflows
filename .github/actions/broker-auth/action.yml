name: Broker authenticated Alchemy deploy
description: Exchange GitHub OIDC through Pocket ID, check out provider credentials, and run local Alchemy
inputs:
  working-directory:
    description: Directory containing the Alchemy project
    required: false
    default: .
  check_only:
    description: Verify broker checkout and provider credentials without deploying
    required: false
    default: "false"
  deployment-profile:
    description: npm, bun, or bun-fnox
    required: false
    default: npm
  pocket-client-id:
    description: Caller repository's Pocket ID client for the broker exchange
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      if: ${{ inputs.check_only == 'false' && inputs.deployment-profile == 'npm' }}
      env:
        POCKET_ISSUER: https://auth.maccrae.family
        POCKET_CLIENT_ID: ${{ inputs.pocket-client-id }}
        POCKET_FEDERATED_AUDIENCE: https://auth.maccrae.family
        BROKER_URL: https://broker.ops.sweepy.dev
        ALCHEMY_DIRECTORY: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/broker-auth.mjs" -- npm exec --no -- alchemy deploy
    - shell: bash
      if: ${{ inputs.check_only == 'false' && inputs.deployment-profile == 'bun' }}
      env:
        POCKET_ISSUER: https://auth.maccrae.family
        POCKET_CLIENT_ID: ${{ inputs.pocket-client-id }}
        POCKET_FEDERATED_AUDIENCE: https://auth.maccrae.family
        BROKER_URL: https://broker.ops.sweepy.dev
        ALCHEMY_DIRECTORY: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/broker-auth.mjs" -- bun run deploy
    - shell: bash
      if: ${{ inputs.check_only == 'false' && inputs.deployment-profile == 'bun-fnox' }}
      env:
        POCKET_ISSUER: https://auth.maccrae.family
        POCKET_CLIENT_ID: ${{ inputs.pocket-client-id }}
        POCKET_FEDERATED_AUDIENCE: https://auth.maccrae.family
        BROKER_URL: https://broker.ops.sweepy.dev
        ALCHEMY_DIRECTORY: ${{ inputs.working-directory }}
      run: fnox exec --replace -- node "$GITHUB_ACTION_PATH/broker-auth.mjs" -- bun run deploy
    - shell: bash
      if: ${{ inputs.check_only == 'true' }}
      env:
        POCKET_ISSUER: https://auth.maccrae.family
        POCKET_CLIENT_ID: ${{ inputs.pocket-client-id }}
        POCKET_FEDERATED_AUDIENCE: https://auth.maccrae.family
        BROKER_URL: https://broker.ops.sweepy.dev
        ALCHEMY_DIRECTORY: ${{ inputs.working-directory }}
        BROKER_CHECK_MODE: "1"
      run: node "$GITHUB_ACTION_PATH/broker-auth.mjs" -- node "$GITHUB_ACTION_PATH/check.mjs"
