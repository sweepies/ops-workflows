name: Alchemy deploy through Pocket ID broker
on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: false
        default: .
      deployment_profile:
        type: string
        required: false
        default: npm
      secret_source:
        description: fnox (age-encrypted secrets via FNOX_AGE_KEY) or bao (OpenBao via Pocket ID)
        type: string
        required: false
        default: fnox
      pocket_broker_client_id:
        description: >-
          Caller's Pocket ID client for the GitHub -> Pocket ID -> broker exchange.
          Pocket ID matches federated identities by issuer, so each repository has
          its own client whose Subject is that repository's sub for this workflow.
        type: string
        required: true
      bao_address:
        description: OpenBao API base URL (bao mode)
        type: string
        required: false
        default: https://bao.maccrae.family
      bao_jwt_role:
        description: OpenBao GitHub JWT role bound to the caller's repository_id and workflow_ref (bao mode)
        type: string
        required: false
        default: ""
      bao_jwt_mount:
        description: OpenBao JWT auth mount trusting GitHub Actions OIDC (bao mode)
        type: string
        required: false
        default: jwt
      bao_secret_path:
        description: OpenBao KV v2 logical path, e.g. kv/renovate-ce (bao mode)
        type: string
        required: false
        default: ""
      claim_preflight:
        type: boolean
        required: false
        default: false
      exchange_preflight:
        type: boolean
        required: false
        default: false
      integration_preflight:
        type: boolean
        required: false
        default: false
      cloudflare_account_id:
        description: Cloudflare account ID for alchemy state (not a secret)
        type: string
        required: false
        default: ""
    secrets:
      FNOX_AGE_KEY:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub OIDC claim contract
        if: inputs.claim_preflight
        env:
          POCKET_FEDERATED_AUDIENCE: https://auth.maccrae.family
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', process.env.POCKET_FEDERATED_AUDIENCE);
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!response.ok) throw new Error(`GitHub OIDC returned HTTP ${response.status}`);
          const { value } = await response.json();
          if (typeof value !== 'string') throw new Error('GitHub OIDC token missing');
          console.log(`::add-mask::${value}`);
          const payload = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
          console.log(JSON.stringify({
            iss: payload.iss,
            aud: payload.aud,
            sub: payload.sub,
            job_workflow_ref: payload.job_workflow_ref,
          }));
          NODE

      - name: Verify Pocket ID client credentials exchange
        if: inputs.exchange_preflight
        env:
          POCKET_BROKER_CLIENT_ID: ${{ inputs.pocket_broker_client_id }}
        run: |
          node --input-type=module <<'NODE'
          const issuer = 'https://auth.maccrae.family';
          const audience = issuer;
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', audience);
          const assertionResponse = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!assertionResponse.ok) throw new Error(`GitHub OIDC returned HTTP ${assertionResponse.status}`);
          const { value: assertion } = await assertionResponse.json();
          if (typeof assertion !== 'string') throw new Error('GitHub assertion missing');
          console.log(`::add-mask::${assertion}`);
          const discoveryResponse = await fetch(`${issuer}/.well-known/openid-configuration`);
          if (!discoveryResponse.ok) throw new Error('Pocket ID discovery failed');
          const discovery = await discoveryResponse.json();
          if (discovery.issuer !== issuer) throw new Error('Pocket ID issuer mismatch');
          const body = new URLSearchParams({
            grant_type: 'client_credentials',
            client_id: process.env.POCKET_BROKER_CLIENT_ID,
            client_assertion_type: 'urn:ietf:params:oauth:client-assertion-type:jwt-bearer',
            client_assertion: assertion,
            resource: 'https://broker.ops.sweepy.dev',
            scope: 'cloudflare:full-access railway:full-access',
          });
          const exchange = await fetch(discovery.token_endpoint, { method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
          if (!exchange.ok) {
            const detail = await exchange.json().catch(() => ({}));
            console.log(JSON.stringify({ exchange_status: exchange.status,
              error: detail.error, error_description: detail.error_description }));
            throw new Error(`Pocket ID exchange returned HTTP ${exchange.status}`);
          }
          const { access_token: token, expires_in } = await exchange.json();
          if (typeof token !== 'string') throw new Error('Pocket ID access token missing');
          console.log(`::add-mask::${token}`);
          const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
          const scopes = payload.scope ?? payload.scp;
          const aud = payload.aud;
          if (!(Array.isArray(aud) ? aud.includes('https://broker.ops.sweepy.dev') : aud === 'https://broker.ops.sweepy.dev')) throw new Error('Broker audience missing');
          if (payload.exp - payload.iat > 600 || payload.exp <= Math.floor(Date.now() / 1000)) throw new Error('Access token lifetime invalid');
          console.log(JSON.stringify({ issuer: payload.iss, audience: aud, subject: payload.sub,
            scope_shape: Array.isArray(scopes) ? 'array' : typeof scopes,
            scopes, lifetime_seconds: payload.exp - payload.iat, expires_in }));
          NODE

      - name: Checkout caller repository
        if: ${{ !inputs.claim_preflight && !inputs.exchange_preflight && !inputs.integration_preflight }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate inputs
        if: ${{ !inputs.claim_preflight && !inputs.exchange_preflight && !inputs.integration_preflight }}
        env:
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
          SECRET_SOURCE: ${{ inputs.secret_source }}
          BAO_JWT_ROLE: ${{ inputs.bao_jwt_role }}
          BAO_SECRET_PATH: ${{ inputs.bao_secret_path }}
        run: |
          case "$SECRET_SOURCE" in
            fnox) case "$DEPLOYMENT_PROFILE" in npm|bun-fnox) ;; *) echo 'fnox mode needs npm or bun-fnox' >&2; exit 1 ;; esac ;;
            bao)
              case "$DEPLOYMENT_PROFILE" in npm|bun) ;; *) echo 'bao mode needs npm or bun' >&2; exit 1 ;; esac
              [ -n "$BAO_JWT_ROLE" ] || { echo 'bao mode needs bao_jwt_role' >&2; exit 1; }
              [ -n "$BAO_SECRET_PATH" ] || { echo 'bao mode needs bao_secret_path' >&2; exit 1; }
              ;;
            *) echo 'secret_source must be fnox or bao' >&2; exit 1 ;;
          esac

      - name: Install Bun and fnox
        if: ${{ !inputs.claim_preflight && !inputs.exchange_preflight && !inputs.integration_preflight && inputs.deployment_profile == 'bun-fnox' }}
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac

      - name: Install Bun
        if: ${{ !inputs.claim_preflight && !inputs.exchange_preflight && !inputs.integration_preflight && inputs.deployment_profile == 'bun' }}
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac

      - name: Install Bun project dependencies
        if: ${{ !inputs.claim_preflight && !inputs.exchange_preflight && !inputs.integration_preflight && (inputs.deployment_profile == 'bun-fnox' || inputs.deployment_profile == 'bun') }}
        working-directory: ${{ inputs.working_directory }}
        run: bun install --frozen-lockfile

      - name: Install npm project dependencies
        if: ${{ !inputs.claim_preflight && !inputs.exchange_preflight && !inputs.integration_preflight && inputs.deployment_profile == 'npm' }}
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Fetch secrets from OpenBao
        if: ${{ !inputs.claim_preflight && !inputs.exchange_preflight && !inputs.integration_preflight && inputs.secret_source == 'bao' }}
        uses: sweepies/ops-workflows/.github/actions/fetch-bao-secrets@main
        with:
          bao-address: ${{ inputs.bao_address }}
          jwt-mount: ${{ inputs.bao_jwt_mount }}
          jwt-role: ${{ inputs.bao_jwt_role }}
          secret-path: ${{ inputs.bao_secret_path }}

      - name: Deploy with broker credentials
        if: ${{ !inputs.claim_preflight && !inputs.exchange_preflight && !inputs.integration_preflight }}
        uses: sweepies/ops-workflows/.github/actions/broker-auth@main
        with:
          working-directory: ${{ inputs.working_directory }}
          deployment-profile: ${{ inputs.deployment_profile }}
          pocket-client-id: ${{ inputs.pocket_broker_client_id }}
        env:
          CI: "true"
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id || env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify broker and provider credentials
        if: inputs.integration_preflight
        uses: sweepies/ops-workflows/.github/actions/broker-auth@main
        with:
          check_only: "true"
          pocket-client-id: ${{ inputs.pocket_broker_client_id }}
